server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy API calls to backend container
    location /api/ {
        proxy_pass http://backend:8080/api/;
    }

    location /auth/ {
        proxy_pass http://backend:8080/auth/;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}