services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: aviclear-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: aviclear
      POSTGRES_USER: aviclear
      POSTGRES_PASSWORD: aviclear_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aviclear -d aviclear"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: aviclear-api:latest
    container_name: aviclear-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: aviclear
      POSTGRES_USER: aviclear
      POSTGRES_PASSWORD: aviclear_dev
      GROQ_API_KEY: ${GROQ_API_KEY}
      RAPIDAPI_KEY: ${RAPIDAPI_KEY}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: aviclear-frontend:latest
    container_name: aviclear-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
